name: Generate Quiz Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wkhtmltopdf ffmpeg

    - name: Fix wkhtmltoimage (safe)
      run: |
        if [ ! -f /usr/bin/wkhtmltoimage ]; then
          sudo ln -s /usr/bin/wkhtmltopdf /usr/bin/wkhtmltoimage
        fi

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Debug installed packages
      run: |
        pip list

    - name: Run script
      run: python main.py

    - name: Upload video
      uses: actions/upload-artifact@v4
      with:
        name: quiz-video
        path: quiz_video.mp4