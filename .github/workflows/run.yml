name: Generate Quiz Video

on:
  push:
    branches:
      - main

  workflow_dispatch:

  # ⏰ Run every 1 hour
  schedule:
    - cron: "0 * * * *"

# ✅ REQUIRED: allow commit back to repo
permissions:
  contents: write

# ✅ Prevent parallel runs corrupting memory
concurrency:
  group: quiz-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30   # ✅ Prevent timeout issues

    steps:
      # ✅ Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # 🚀 Cache pip (FASTER RUNS)
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}


         
      # ✅ Install system dependencies
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf ffmpeg

      # ✅ Install Hindi fonts
      - name: Install Hindi fonts
        run: |
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-color-emoji

      # ✅ Fix wkhtmltoimage issue
      - name: Ensure wkhtmltoimage exists
        run: |
          if [ ! -f /usr/bin/wkhtmltoimage ]; then
            sudo ln -s /usr/bin/wkhtmltopdf /usr/bin/wkhtmltoimage
          fi

      # ✅ Setup Python
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # ✅ Install Python dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Ensure memory folder + files exist
      - name: Prepare memory folder
        run: |
          mkdir -p data/history
          if [ ! -f data/history/history.json ]; then
            echo '{"questions": []}' > data/history/history.json
          fi

      # ✅ Create output folder
      - name: Create output folder
        run: mkdir -p output

      # ✅ Run your quiz generator
      - name: Run Quiz Generator
        run: python app.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}

      # ✅ Debug (optional)
      - name: List generated files
        run: ls -R

      # ✅ Commit memory (JSON + FAISS files)
      - name: Commit quiz memory
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add data/history/

          git diff --cached --quiet || git commit -m "Update quiz memory"
          git push

      # ✅ Upload video artifact
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiz-video
          path: output/quiz_video.mp4