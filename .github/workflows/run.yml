name: Generate Quiz Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    # 🐍 Setup Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 🎬 Install system dependencies
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg imagemagick

    # 🔧 Fix ImageMagick policy (VERY IMPORTANT for MoviePy TextClip)
    - name: Fix ImageMagick policy
      run: |
        sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true
        sudo sed -i 's/rights="none" pattern="LABEL"/rights="read|write" pattern="LABEL"/' /etc/ImageMagick-6/policy.xml || true

    # 📦 Install Python dependencies
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ▶️ Run your script
    - name: Run script
      run: python main.py

    # 📤 Upload generated video
    - name: Upload video
      uses: actions/upload-artifact@v4
      with:
        name: quiz-video
        path: quiz_video.mp4