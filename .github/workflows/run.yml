name: Generate Quiz Video

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # ✅ Checkout repo
    - name: Checkout repository
      uses: actions/checkout@v3

    # ✅ Install system dependencies
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y wkhtmltopdf ffmpeg

    # ✅ Fix wkhtmltoimage issue (SAFE)
    - name: Ensure wkhtmltoimage exists
      run: |
        if [ ! -f /usr/bin/wkhtmltoimage ]; then
          sudo ln -s /usr/bin/wkhtmltopdf /usr/bin/wkhtmltoimage
        fi

    # ✅ Setup Python
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # ✅ Install Python dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # ✅ IMPORTANT: Create output folder
    - name: Create output folder
      run: mkdir -p output

    # ✅ Run your script
    - name: Run Quiz Generator
      run: python app.py
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

    # ✅ Debug (optional but recommended)
    - name: List generated files
      run: ls -R

    # ✅ Upload generated video
    - name: Upload video artifact
      uses: actions/upload-artifact@v4
      with:
        name: quiz-video
        path: output/quiz_video.mp4