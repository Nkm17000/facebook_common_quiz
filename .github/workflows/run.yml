name: Generate Quiz Video

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"   # every 1 hour

permissions:
  contents: write

# ✅ Prevent parallel memory corruption
concurrency:
  group: quiz-history
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # =========================
      # 📥 Checkout
      # =========================
      - name: Checkout repository
        uses: actions/checkout@v3

      # =========================
      # ⚡ Cache pip
      # =========================
      - name: Cache pip
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      # =========================
      # 🤖 Cache HF models (IMPORTANT)
      # =========================
      - name: Cache HuggingFace
        uses: actions/cache@v3
        with:
          path: ~/.cache/huggingface
          key: hf-cache

      # =========================
      # 🧱 System deps
      # =========================
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y wkhtmltopdf ffmpeg

      # =========================
      # 🌐 Fonts
      # =========================
      - name: Install Hindi fonts
        run: |
          sudo apt-get install -y fonts-noto fonts-noto-cjk fonts-noto-color-emoji

      # =========================
      # 🔧 wkhtmltoimage fix
      # =========================
      - name: Ensure wkhtmltoimage exists
        run: |
          if [ ! -f /usr/bin/wkhtmltoimage ]; then
            sudo ln -s /usr/bin/wkhtmltopdf /usr/bin/wkhtmltoimage
          fi

      # =========================
      # 🐍 Python
      # =========================
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # =========================
      # 📦 Install deps
      # =========================
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # =========================
      # 🔐 HF Token (optional fix)
      # =========================
      - name: Set HF Token
        run: echo "HF_TOKEN=${{ secrets.HF_TOKEN }}" >> $GITHUB_ENV

      # =========================
      # 🧠 Prepare memory
      # =========================
      - name: Prepare memory folder
        run: |
          mkdir -p data/history
          if [ ! -f data/history/history.json ]; then
            echo '{"questions": []}' > data/history/history.json
          fi

      # =========================
      # 🧹 Fix FAISS corruption
      # =========================
      - name: Clean FAISS index
        run: |
          if [ -f data/history/vectors.index ]; then
            if [ ! -s data/history/vectors.index ]; then
              echo "Deleting corrupted FAISS index"
              rm data/history/vectors.index
            fi
          fi

      # =========================
      # 📁 Output dir
      # =========================
      - name: Create output folder
        run: mkdir -p output

      # =========================
      # ▶️ Run app
      # =========================
      - name: Run Quiz Generator
        run: python app.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_ACCESS_TOKEN: ${{ secrets.FACEBOOK_ACCESS_TOKEN }}

      # =========================
      # 🔍 Debug
      # =========================
      - name: List generated files
        run: ls -R

      # =========================
      # 💾 Commit memory (FIXED)
      # =========================
      - name: Commit quiz memory (SAFE)
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          git add data/history/

          git commit -m "Update quiz memory" || echo "No changes"

          # ✅ FIX: pull + retry
          for i in 1 2 3
          do
            git pull --rebase origin main && git push origin main && break
            echo "Retry $i..."
            sleep 5
          done

      # =========================
      # 📤 Upload video
      # =========================
      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: quiz-video
          path: output/quiz_video.mp4